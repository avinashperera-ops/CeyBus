<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CeyBus — Passenger Live Tracking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f6f6f7',
                            100: '#e0e0e0',
                            900: '#0f0f11',
                            dark: '#121214'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS & JS for Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Socket.IO Client -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Modern Monochrome Animated Dash Flow */
        @keyframes dash-flow-outbound {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }

        @keyframes dash-flow-inbound {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 24; }
        }

        .route-animated-outbound {
            stroke-dasharray: 8, 12;
            animation: dash-flow-outbound 1.2s linear infinite;
        }

        .route-animated-inbound {
            stroke-dasharray: 8, 12;
            animation: dash-flow-inbound 1.2s linear infinite;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfc;
            color: #0f0f11;
            -webkit-tap-highlight-color: transparent;
        }
        #map {
            height: 100%;
            width: 100%;
            z-index: 10;
        }
        .leaflet-container {
            font-family: 'Inter', sans-serif !important;
        }
        /* Custom Bus Marker Pulse Animation */
        .bus-marker-pulse {
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col antialiased selection:bg-black selection:text-white overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="w-full bg-white border-b border-neutral-200/80 px-4 sm:px-6 py-3.5 flex items-center justify-between shrink-0 z-30 shadow-sm">
        <a href="/" class="flex items-center gap-2.5 group">
            <div class="w-8 h-8 bg-black text-white font-black text-xs flex items-center justify-center rounded-lg shadow-sm group-hover:scale-105 transition-transform">
                CB
            </div>
            <span class="text-lg font-bold tracking-tight text-neutral-900">CeyBus</span>
            <span class="hidden sm:inline-block ml-2 px-2.5 py-0.5 rounded-full bg-neutral-100 text-[10px] font-semibold text-neutral-600 uppercase tracking-wider">Passenger Radar</span>
        </a>

        <div class="flex items-center gap-2">
            <span class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-semibold">
                <span id="socketDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="activeCountHeader">Connecting...</span>
            </span>
            <a href="/login.html" class="px-4 py-2 text-xs font-semibold text-neutral-700 hover:text-black transition-colors rounded-full hover:bg-neutral-100">
                Account
            </a>
        </div>
    </header>

    <!-- Main Workspace Split Container -->
    <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
        
        <!-- Left Sidebar: Route Search & Live Active Bus Feed -->
        <aside class="w-full md:w-96 bg-white border-r border-neutral-200/80 flex flex-col shrink-0 z-20 max-h-[45vh] md:max-h-full shadow-md md:shadow-none">
            
            <!-- Search & Filter Bar -->
            <div class="p-4 border-b border-neutral-100 bg-neutral-50/50">
                <form id="searchFilterForm" class="space-y-2">
                    <div class="relative">
                        <input type="text" id="routeQueryInput" placeholder="Search route (e.g., 138, Pettah, Kandy)" class="w-full bg-white border border-neutral-200 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-black font-medium">
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="originSelectFilter" class="w-1/2 bg-white border border-neutral-200 rounded-lg px-2.5 py-1.5 text-[11px] text-neutral-700 font-medium focus:outline-none">
                            <option value="">All Origins</option>
                        </select>
                        <select id="destinationSelectFilter" class="w-1/2 bg-white border border-neutral-200 rounded-lg px-2.5 py-1.5 text-[11px] text-neutral-700 font-medium focus:outline-none">
                            <option value="">All Destinations</option>
                        </select>
                    </div>
                </form>
            </div>

            <!-- Active Bus List Container -->
            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="activeBusesList">
                <div class="text-center py-8 text-neutral-400 text-xs font-medium">
                    Fetching live active fleet...
                </div>
            </div>

        </aside>

        <!-- Right Side: Leaflet Interactive Map Workspace -->
        <main class="flex-1 relative h-full w-full">
            <div id="map"></div>

            <!-- Selected Bus Live Floating Telemetry Overlay -->
            <div id="busTelemetryOverlay" class="hidden absolute bottom-6 left-6 right-6 md:left-auto md:right-6 md:w-80 bg-white border border-neutral-200/90 rounded-2xl p-4 shadow-xl z-20">
                <div class="flex items-center justify-between pb-3 border-b border-neutral-100">
                    <div class="flex items-center gap-2.5">
                        <div id="overlayRouteBadge" class="w-8 h-8 rounded-lg bg-black text-white flex items-center justify-center text-xs font-bold shrink-0">
                            --
                        </div>
                        <div>
                            <h4 id="overlayRouteName" class="text-xs font-bold text-neutral-900">Bus Details</h4>
                            <p id="overlayPlateNumber" class="text-[10px] font-mono text-neutral-500 font-semibold">Plate: --</p>
                        </div>
                    </div>
                    <button id="closeOverlayBtn" class="text-neutral-400 hover:text-black p-1 rounded-lg transition-colors">
                        ✕
                    </button>
                </div>
                <div class="pt-3 grid grid-cols-2 gap-2 text-left">
                    <div class="bg-neutral-50 p-2.5 rounded-xl">
                        <p class="text-[9px] text-neutral-400 uppercase font-bold tracking-wider">Speed</p>
                        <p id="overlaySpeed" class="text-xs font-bold text-neutral-900 mt-0.5">0 km/h</p>
                    </div>
                    <div class="bg-neutral-50 p-2.5 rounded-xl">
                        <p class="text-[9px] text-neutral-400 uppercase font-bold tracking-wider">Direction</p>
                        <p id="overlayDirection" class="text-xs font-bold text-neutral-900 capitalize mt-0.5">Outbound</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Client Script -->
    <script>
        const socket = io();
        let map;
        let busMarkers = new Map();
        let busesMap = new Map();
        let selectedPlateNumber = null;
        let currentRouteLayer = null;

        // Initialize Leaflet Map
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([6.9271, 79.8612], 11);
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap | CeyBus Transit'
            }).addTo(map);
        }

        initMap();

        // Load Modern Monochrome Route GeoJSON Shape with Directional Flow
        function loadBusRouteOnMap(routeInput, direction = 'Outbound') {
            if (!routeInput) return;

            const cleanRoute = String(routeInput).replace(/[^0-9]/g, '');
            console.log(`[GeoJSON] Requesting route shape for Route ${cleanRoute} (${direction})...`);

            fetch(`/api/routes/${cleanRoute}/shape`)
                .then(res => res.json())
                .then(data => {
                    if (!data.success || !data.geojson) {
                        console.warn(`No shape found for route: ${cleanRoute}`);
                        return;
                    }

                    // Remove existing route layers
                    if (currentRouteLayer) {
                        map.removeLayer(currentRouteLayer);
                    }

                    const isOutbound = String(direction).toLowerCase() !== 'inbound';
                    const animClass = isOutbound ? 'route-animated-outbound' : 'route-animated-inbound';

                    // Create a custom LayerGroup for casing + core line + animated flow
                    const routeGroup = L.layerGroup();

                    // Layer 1: Dark Casing / Outer Track
                    const casingLayer = L.geoJSON(data.geojson, {
                        style: {
                            color: '#09090b',
                            weight: 8,
                            opacity: 0.85,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }
                    });

                    // Layer 2: Modern Off-White Core Line
                    const coreLayer = L.geoJSON(data.geojson, {
                        style: {
                            color: '#f4f4f5',
                            weight: 4,
                            opacity: 0.95,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }
                    });

                    // Layer 3: Animated Directional Flow Line
                    const flowLayer = L.geoJSON(data.geojson, {
                        style: {
                            color: '#000000',
                            weight: 3,
                            opacity: 0.8,
                            className: animClass
                        }
                    });

                    routeGroup.addLayer(casingLayer);
                    routeGroup.addLayer(coreLayer);
                    routeGroup.addLayer(flowLayer);

                    currentRouteLayer = routeGroup.addTo(map);

                    // Fit map view to route bounds
                    const bounds = casingLayer.getBounds();
                    if (bounds.isValid()) {
                        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
                    }
                })
                .catch(err => console.error('Error loading route shape:', err));
        }

        // Socket Event Listeners
        socket.on('connect', () => {
            document.getElementById('socketDot').className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse';
            fetchActiveBuses();
        });

        socket.on('disconnect', () => {
            document.getElementById('socketDot').className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
            document.getElementById('activeCountHeader').innerText = 'Disconnected';
        });

        socket.on('busLocationUpdated', (data) => {
            if (data && data.plateNumber) {
                busesMap.set(data.plateNumber, data);
                updateOrAddMarker(data);
                renderBusesList();
                updateHeaderCounter();

                if (selectedPlateNumber === data.plateNumber) {
                    updateOverlayData(data);
                    if (data.routeNumber) {
                        loadBusRouteOnMap(data.routeNumber, data.direction || 'Outbound');
                    }
                }
            }
        });

        socket.on('busOffline', (data) => {
            if (data && data.plateNumber) {
                busesMap.delete(data.plateNumber);
                if (busMarkers.has(data.plateNumber)) {
                    map.removeLayer(busMarkers.get(data.plateNumber));
                    busMarkers.delete(data.plateNumber);
                }
                renderBusesList();
                updateHeaderCounter();

                if (selectedPlateNumber === data.plateNumber) {
                    document.getElementById('busTelemetryOverlay').classList.add('hidden');
                    if (currentRouteLayer) {
                        map.removeLayer(currentRouteLayer);
                    }
                    selectedPlateNumber = null;
                }
            }
        });

        async function fetchActiveBuses() {
            try {
                const res = await fetch('/api/buses/active');
                if (res.ok) {
                    const buses = await res.json();
                    buses.forEach(b => {
                        const plate = b.plateNumber || b.id;
                        if (plate) {
                            busesMap.set(plate, b);
                            updateOrAddMarker(b);
                        }
                    });
                    renderBusesList();
                    updateHeaderCounter();
                    populateFilterDropdowns();
                }
            } catch (err) {
                console.warn('Error fetching active fleet:', err);
                renderBusesList();
            }
        }

        function updateOrAddMarker(bus) {
            const lat = bus.latitude || bus.lat;
            const lng = bus.longitude || bus.lng;
            const plate = bus.plateNumber || bus.id;

            if (!lat || !lng || !plate) return;

            const icon = L.divIcon({
                className: 'custom-bus-icon',
                html: `
                    <div class="w-8 h-8 bg-black text-white rounded-full flex items-center justify-center font-bold text-[10px] border-2 border-white shadow-lg bus-marker-pulse cursor-pointer">
                        ${bus.routeNumber || 'CB'}
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            if (busMarkers.has(plate)) {
                busMarkers.get(plate).setLatLng([lat, lng]);
            } else {
                const marker = L.marker([lat, lng], { icon }).addTo(map);
                marker.on('click', () => selectBus(plate));
                busMarkers.set(plate, marker);
            }
        }

        function updateHeaderCounter() {
            const count = busesMap.size;
            document.getElementById('activeCountHeader').innerText = `${count} Active ${count === 1 ? 'Bus' : 'Buses'}`;
        }

        function selectBus(plateNumber) {
            const bus = busesMap.get(plateNumber);
            if (!bus) return;

            selectedPlateNumber = plateNumber;
            const lat = bus.latitude || bus.lat;
            const lng = bus.longitude || bus.lng;

            if (lat && lng) {
                map.flyTo([lat, lng], 14, { duration: 1 });
            }

            if (bus.routeNumber) {
                loadBusRouteOnMap(bus.routeNumber, bus.direction || 'Outbound');
            }

            updateOverlayData(bus);
            document.getElementById('busTelemetryOverlay').classList.remove('hidden');
        }

        function updateOverlayData(bus) {
            document.getElementById('overlayRouteBadge').innerText = bus.routeNumber || 'CB';
            document.getElementById('overlayRouteName').innerText = `${bus.origin || 'Origin'} ⇄ ${bus.destination || 'Destination'}`;
            document.getElementById('overlayPlateNumber').innerText = `Plate: ${bus.plateNumber || 'N/A'}`;
            document.getElementById('overlaySpeed').innerText = `${bus.speed ? Math.round(bus.speed) : 0} km/h`;
            document.getElementById('overlayDirection').innerText = bus.direction || 'Outbound';
        }

        function renderBusesList() {
            const container = document.getElementById('activeBusesList');
            const query = document.getElementById('routeQueryInput').value.toLowerCase().trim();
            const selectedOrigin = document.getElementById('originSelectFilter').value;
            const selectedDest = document.getElementById('destinationSelectFilter').value;

            let buses = Array.from(busesMap.values());

            if (query) {
                buses = buses.filter(b => 
                    (b.routeNumber && b.routeNumber.toLowerCase().includes(query)) ||
                    (b.origin && b.origin.toLowerCase().includes(query)) ||
                    (b.destination && b.destination.toLowerCase().includes(query)) ||
                    (b.plateNumber && b.plateNumber.toLowerCase().includes(query))
                );
            }

            if (selectedOrigin) {
                buses = buses.filter(b => b.origin === selectedOrigin);
            }

            if (selectedDest) {
                buses = buses.filter(b => b.destination === selectedDest);
            }

            if (buses.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-neutral-400 text-xs font-medium">
                        No active buses match your criteria.
                    </div>
                `;
                return;
            }

            container.innerHTML = buses.map(b => {
                const plate = b.plateNumber || b.id;
                const isSelected = selectedPlateNumber === plate;
                return `
                    <div onclick="selectBus('${plate}')" class="p-3.5 rounded-xl border transition-all cursor-pointer ${isSelected ? 'bg-neutral-900 text-white border-black shadow-md' : 'bg-white text-neutral-900 border-neutral-200/80 hover:border-neutral-300'}">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${isSelected ? 'bg-white text-black' : 'bg-neutral-100 text-neutral-800'}">
                                Route ${b.routeNumber || 'CB'}
                            </span>
                            <span class="text-[10px] font-mono font-bold ${isSelected ? 'text-neutral-400' : 'text-neutral-500'}">
                                ${plate}
                            </span>
                        </div>
                        <p class="text-xs font-bold truncate">${b.origin || 'Origin'} ⇄ ${b.destination || 'Destination'}</p>
                        <div class="flex items-center justify-between text-[10px] mt-2 ${isSelected ? 'text-neutral-400' : 'text-neutral-500'} font-medium">
                            <span>Speed: ${b.speed ? Math.round(b.speed) : 0} km/h</span>
                            <span class="text-emerald-500 font-bold">● Live Telemetry</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function populateFilterDropdowns() {
            const origins = new Set();
            const destinations = new Set();

            busesMap.forEach(b => {
                if (b.origin) origins.add(b.origin);
                if (b.destination) destinations.add(b.destination);
            });

            const originSelect = document.getElementById('originSelectFilter');
            const destSelect = document.getElementById('destinationSelectFilter');

            originSelect.innerHTML = '<option value="">All Origins</option>' + 
                Array.from(origins).map(o => `<option value="${o}">${o}</option>`).join('');

            destSelect.innerHTML = '<option value="">All Destinations</option>' + 
                Array.from(destinations).map(d => `<option value="${d}">${d}</option>`).join('');
        }

        // Event Handlers for Filters
        document.getElementById('routeQueryInput').addEventListener('input', renderBusesList);
        document.getElementById('originSelectFilter').addEventListener('change', renderBusesList);
        document.getElementById('destinationSelectFilter').addEventListener('change', renderBusesList);

        document.getElementById('closeOverlayBtn').addEventListener('click', () => {
            document.getElementById('busTelemetryOverlay').classList.add('hidden');
            selectedPlateNumber = null;
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
            }
            renderBusesList();
        });

        // URL Query Parameter Handling
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const routeParam = params.get('route');
            const fromParam = params.get('from');
            const toParam = params.get('to');

            if (routeParam) {
                document.getElementById('routeQueryInput').value = routeParam;
            } else if (fromParam || toParam) {
                if (fromParam) document.getElementById('routeQueryInput').value = fromParam;
            }
        });
    </script>
</body>
</html>
