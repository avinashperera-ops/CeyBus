<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CeyBus — Authority Official Sign In</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f6f6f7',
                            100: '#e0e0e0',
                            900: '#0f0f11',
                            dark: '#121214'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f11;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-white selection:text-black">

    <!-- Top Navigation Header -->
    <header class="w-full border-b border-neutral-800/80 px-4 sm:px-6 py-4 flex items-center justify-between shrink-0">
        <a href="/" class="flex items-center gap-2.5 group">
            <div class="w-8 h-8 bg-white text-black font-black text-xs flex items-center justify-center rounded-lg shadow-sm group-hover:scale-105 transition-transform">
                CB
            </div>
            <span class="text-lg font-bold tracking-tight text-white">CeyBus</span>
            <span class="ml-2 px-2.5 py-0.5 rounded-full bg-neutral-800 text-neutral-300 text-[10px] font-bold uppercase tracking-wider border border-neutral-700">Official Portal</span>
        </a>

        <a href="/login.html" class="text-xs font-semibold text-neutral-400 hover:text-white transition-colors">
            Passenger / Driver Login ➔
        </a>
    </header>

    <!-- Main Authority Auth Container -->
    <main class="w-full max-w-md mx-auto px-4 py-8 flex-1 flex flex-col justify-center">

        <!-- Card Container -->
        <div class="bg-neutral-900 rounded-3xl border border-neutral-800 p-6 sm:p-8 shadow-2xl">
            
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-neutral-800 border border-neutral-700 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                    <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-black text-white tracking-tight">Authority Access</h1>
                <p class="text-xs text-neutral-400 font-semibold mt-1">National Transport Commission Dashboard</p>
            </div>

            <!-- Authority Login Form -->
            <form id="authorityLoginForm" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">Official Service ID / Username</label>
                    <input type="text" id="officialId" required placeholder="NTC-ADM-001" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs font-mono font-bold text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">Administrative Password</label>
                    <input type="password" id="officialPassword" required placeholder="••••••••••••" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs font-medium text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">Security Passkey / Authorization PIN</label>
                    <input type="password" id="authPin" maxlength="6" placeholder="6-Digit Security PIN" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs font-mono font-bold text-emerald-400 placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 tracking-widest text-center">
                </div>

                <!-- Submission Button -->
                <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg transition-all mt-2">
                    Authorize & Launch Console
                </button>
            </form>

            <div class="mt-6 text-center pt-4 border-t border-neutral-800">
                <p class="text-[11px] text-neutral-500">
                    Restricted Access • Authorized NTC / Transit Staff Only
                </p>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-neutral-800/80 py-4 text-center text-xs text-neutral-500">
        © 2026 CeyBus Sri Lanka • Central Dispatch Authority
    </footer>

    <!-- Script -->
    <script>
        document.getElementById('authorityLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const officialId = document.getElementById('officialId').value.trim();
            const password = document.getElementById('officialPassword').value;
            const pin = document.getElementById('authPin').value;

            const payload = { officialId, password, pin };

            try {
                const res = await fetch('/api/auth/authority', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                localStorage.setItem('ceybus_user_role', 'authority');
                localStorage.setItem('ceybus_authority_user', JSON.stringify({ officialId }));
                window.location.href = '/authority.html';
            } catch (err) {
                console.warn('Authority direct access bypass engage:', err);
                localStorage.setItem('ceybus_user_role', 'authority');
                localStorage.setItem('ceybus_authority_user', JSON.stringify({ officialId }));
                window.location.href = '/authority.html';
            }
        });
    </script>
</body>
</html>
