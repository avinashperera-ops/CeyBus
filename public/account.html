<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CeyBus — Passenger Account Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #0f0f11; color: #ffffff; }</style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-white selection:text-black">

    <!-- Header -->
    <header class="w-full border-b border-neutral-800 px-6 py-4 flex items-center justify-between">
        <a href="/passenger.html" class="flex items-center gap-2.5 group">
            <div class="w-8 h-8 bg-white text-black font-black text-xs flex items-center justify-center rounded-lg">CB</div>
            <span class="text-lg font-bold tracking-tight text-white">CeyBus Radar</span>
        </a>
        <a href="/passenger.html" class="text-xs font-semibold text-neutral-400 hover:text-white transition-colors">
            ← Back to Live Map
        </a>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl mx-auto px-4 py-10 flex-1 space-y-6">

        <div class="bg-neutral-900 rounded-3xl border border-neutral-800 p-6 sm:p-8 shadow-2xl">
            
            <div class="flex items-center gap-4 pb-6 border-b border-neutral-800">
                <div class="relative group">
                    <img id="accountAvatar" src="https://www.gravatar.com/avatar/?d=mp" alt="Avatar" referrerpolicy="no-referrer" class="w-16 h-16 rounded-full object-cover border-2 border-neutral-700 shadow-md">
                    <label class="absolute bottom-0 right-0 bg-white text-black p-1 rounded-full cursor-pointer shadow hover:bg-neutral-200 transition-all text-[10px]" title="Change Avatar">
                        📷
                        <input type="file" id="accountAvatarInput" accept="image/*" class="hidden">
                    </label>
                </div>
                <div>
                    <h1 id="accountHeaderName" class="text-xl font-black text-white tracking-tight">Loading...</h1>
                    <p id="accountHeaderEmail" class="text-xs text-neutral-400 font-medium">Loading...</p>
                </div>
            </div>

            <!-- Tabs / Sections -->
            <div class="mt-6 space-y-8">

                <!-- Section 1: Edit Profile Information -->
                <form id="profileUpdateForm" class="space-y-4">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-neutral-300">Personal Information</h2>
                    
                    <div>
                        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">Full Name</label>
                        <input type="text" id="updateNameInput" required class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs font-medium text-white focus:outline-none focus:ring-2 focus:ring-white">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">Mobile Number</label>
                        <input type="tel" id="updatePhoneInput" placeholder="0771234567" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs font-medium text-white focus:outline-none focus:ring-2 focus:ring-white">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">Email Address (Read-only)</label>
                        <input type="email" id="updateEmailInput" disabled class="w-full bg-neutral-950/50 border border-neutral-800/60 rounded-xl px-3.5 py-2.5 text-xs font-medium text-neutral-500 cursor-not-allowed">
                    </div>

                    <button type="submit" class="py-2.5 px-5 bg-white text-black font-bold text-xs uppercase tracking-wider rounded-xl hover:bg-neutral-200 transition-all">
                        Save Changes
                    </button>
                </form>

                <!-- Section 2: Change Password -->
                <form id="passwordUpdateForm" class="space-y-4 pt-6 border-t border-neutral-800">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-neutral-300">Security & Password</h2>
                    
                    <div>
                        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">Current Password</label>
                        <input type="password" id="currentPasswordInput" placeholder="••••••••••••" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs font-medium text-white focus:outline-none focus:ring-2 focus:ring-white">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1.5">New Password (Min 8 characters)</label>
                        <input type="password" id="newPasswordInput" placeholder="••••••••••••" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs font-medium text-white focus:outline-none focus:ring-2 focus:ring-white">
                    </div>

                    <button type="submit" class="py-2.5 px-5 bg-neutral-800 hover:bg-neutral-700 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all">
                        Update Password
                    </button>
                </form>

                <!-- Section 3: Account Danger Zone / Logout -->
                <div class="pt-6 border-t border-neutral-800 flex items-center justify-between">
                    <div>
                        <h2 class="text-sm font-bold text-rose-400">Session Controls</h2>
                        <p class="text-xs text-neutral-500 mt-0.5">Sign out from your CeyBus passenger account on this device.</p>
                    </div>
                    <button id="accountLogoutBtn" class="py-2.5 px-5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold text-xs rounded-xl transition-all">
                        Log Out
                    </button>
                </div>

            </div>

        </div>

    </main>

    <footer class="w-full border-t border-neutral-800 py-4 text-center text-xs text-neutral-500">
        © 2026 CeyBus Sri Lanka • Passenger Account Manager
    </footer>

    <!-- Script to Handle Account Interactions -->
    <script>
        const token = localStorage.getItem('ceybus_passenger_token');
        const passengerStr = localStorage.getItem('ceybus_passenger');
        if (!token || !passengerStr) {
            window.location.href = '/login.html';
        }

        let user = JSON.parse(passengerStr);

        // Populate fields on load
        function renderUserData() {
            let avatar = user.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&background=0f0f11&color=fff&bold=true`;
            document.getElementById('accountAvatar').src = avatar;
            document.getElementById('accountHeaderName').innerText = user.name || 'Passenger';
            document.getElementById('accountHeaderEmail').innerText = user.email || user.phone || '';
            document.getElementById('updateNameInput').value = user.name || '';
            document.getElementById('updatePhoneInput').value = user.phone || '';
            document.getElementById('updateEmailInput').value = user.email || '';
        }
        renderUserData();

        // Logout handler
        document.getElementById('accountLogoutBtn').addEventListener('click', () => {
            localStorage.removeItem('ceybus_passenger_token');
            localStorage.removeItem('ceybus_passenger');
            localStorage.removeItem('ceybus_user_role');
            window.location.href = '/login.html';
        });

        // Profile update handler
        document.getElementById('profileUpdateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('updateNameInput').value.trim();
            const phone = document.getElementById('updatePhoneInput').value.trim();

            try {
                const res = await fetch('/api/passenger/me', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, phone })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    user.name = data.passenger.name;
                    user.phone = data.passenger.phone;
                    localStorage.setItem('ceybus_passenger', JSON.stringify(user));
                    renderUserData();
                    alert('Profile updated successfully!');
                } else {
                    alert(data.message || 'Failed to update profile.');
                }
            } catch (err) {
                alert('Connection error.');
            }
        });

        // Password update handler
        document.getElementById('passwordUpdateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPasswordInput').value;
            const newPassword = document.getElementById('newPasswordInput').value;

            if (newPassword.length < 8) {
                alert('New password must be at least 8 characters.');
                return;
            }

            try {
                const res = await fetch('/api/passenger/password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    alert('Password updated successfully!');
                    document.getElementById('currentPasswordInput').value = '';
                    document.getElementById('newPasswordInput').value = '';
                } else {
                    alert(data.message || 'Failed to update password.');
                }
            } catch (err) {
                alert('Connection error.');
            }
        });

        // Profile picture upload handler
        document.getElementById('accountAvatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                const base64Image = uploadEvent.target.result;
                try {
                    const res = await fetch('/api/passenger/profile-picture', {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ profilePicture: base64Image })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        user.profilePicture = data.passenger.profilePicture;
                        localStorage.setItem('ceybus_passenger', JSON.stringify(user));
                        renderUserData();
                        alert('Avatar updated successfully!');
                    } else {
                        alert(data.message || 'Failed to upload avatar.');
                    }
                } catch (err) {
                    alert('Connection error.');
                }
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
